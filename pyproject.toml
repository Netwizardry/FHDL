[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fhdl"
version = "0.2.0"
description = "Fluid Hardware Description Language - 유체 설비 설계 자동화 시스템"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "networkx>=3.2",
    "numpy>=1.26",
    "ezdxf>=1.1",       # 도면 DXF 내보내기 (순수 Python)
]

[project.scripts]
fhdl = "fhdl.app:main"

[project.optional-dependencies]
kb = [
    "pymupdf>=1.23",    # EHDL 지식 DB 빌드(PDF 읽기) 전용 — python -m ehdl.kb.build
]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# 기호표·도면 양식 DXF 에서 추출한 도면 데이터 (drawing/dxf_symbols.py · dxf_form.py 로 재생성)
"fhdl.drawing" = ["data/*.json"]
"ehdl.rules" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
