[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fhdl"
version = "0.2.0"
description = "Fluid Hardware Description Language - 유체 설비 설계 자동화 시스템"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "networkx>=3.2",
    "numpy>=1.26",
]

[project.scripts]
fhdl = "fhdl.app:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
